services:

  echo-hub:
    build: ./echo-hub
    container_name: echo-hub
    command: go run .
    ports:
      - 8080:8080
    volumes:
      - .:/go/src/
    working_dir: /go/src/echo-hub
    depends_on:
      - db-hub
      - rabbitmq
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/echo-hub?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@vision-rabbitmq/
      JWT_SECRET: whatever

  db-hub:
    image: postgres:12.0-alpine
    container_name: echo-db-hub
    environment:
      POSTGRES_DB: echo-hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-hub-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vision-rabbitmq
    volumes:
      - rabbitmq_etc:/etc/rabbitmq/
      - rabbitmq_data:/var/lib/rabbitmq/
      - rabbitmq_logs:/var/log/rabbitmq/
    ports:
      - 5672:5672
      - 15672:15672
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl status"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres-hub-data:
  rabbitmq_etc:
    labels:
      description: "RabbitMQ configuration"
  rabbitmq_data:
    labels:
      description: "RabbitMQ data"
  rabbitmq_logs:
    labels:
      description: "RabbitMQ logs"
